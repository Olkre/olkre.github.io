<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vlad's Auto Center</title>
  <link rel="stylesheet" href="styles.css">

  <!--Fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Scoutie+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
  <header style="display: flex; justify-content: space-between;">
    <a href="index.html">
      <img src="img/logo.png" alt="Vlad's Auto Center logo" />
    </a>
    <a href="#" style="background: white; padding: 10px 20px; vertical-align: middle;">Call</a>
  </header>
  <main>
      <h1>Cars Currently Available</h1>
      <p>Browse our currently available vehicles.</p>
      <table>
          <thead>
              <tr>
                  <th>Image</th>
                  <th>Make</th>
                  <th>Model</th>
                  <th>Year</th>
                  <th>Link</th>
              </tr>
          </thead>
          <tbody>
              <tr>
                  <td><img src="img/jeep.jpg" alt="2014 Jeep Grand Cherokee"></td>
                  <td>Jeep</td>
                  <td>Grand Cherokee</td>
                  <td>2024</td>
                  <td><a href="details.html">View details</a></td>
              </tr>
              <tr>
                  <td><img src="img/honda.avif" alt="2008 Honda Accord"></td>
                  <td>Honda</td>
                  <td>Accord</td>
                  <td>2021</td>
                  <td><a href="details.html">View details</a></td>
              </tr>
              <tr>
                  <td><img src="img/toyota.avif" alt="2026 Toyota RAV4"></td>
                  <td>Toyota</td>
                  <td>RAV4</td>
                  <td>2026</td>
                  <td><a href="details.html">View details</a></td>
              </tr>
          </tbody>
      </table>
  </main>
  <footer>© Vlad's Auto Center - 2026</footer>
  <!--
  CSIS2023 Assignment 1: Create a basic website for a fictional car dealership.
  You will create two pages for a fictional car dealership. This is more about functionality than
  graphics design skill, but you should attempt to produce a reasonably viewable layout.
  Before starting, please read about HTML tables at
  https://www.w3schools.com/html/html_tables.asp
  The first page (index.html) should contain:
  - Valid HTML boilerplate
  - A title tag
  - A logo / title for the page w/ image
  - A heading tag for “Cars Currently Available”
  - A table that contains the following (at least 3):
  o An image of the car
  o Make
  o Model
  o Year
  o Link to view more (a link to details.html) – note that all links go to same page
  - A footer with a copyright message
  The second page (details.html) should contain:
  An expanded version of the information in the first page (larger image, make, model,
  year)

</body>
</html>
